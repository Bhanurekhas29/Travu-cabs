<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Contact Message</title>
</head>
<body style="margin:0; padding:0; background:#f5f7fa; font-family:Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f7fa; padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px; background:#ffffff; border-radius:12px; overflow:hidden;">

          <tr>
            <td style="background:#0a4cd8; padding:24px 32px;">
              <span style="font-size:12px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; color:#eaf1fb;">New Contact Message</span>
              <div style="font-size:20px; font-weight:800; color:#ffffff; margin-top:4px;">{{ full_name }}</div>
            </td>
          </tr>

          <tr>
            <td style="padding:28px 32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="padding:8px 0; font-size:13px; color:#5b6b8c; width:40%;">Mobile</td>
                  <td style="padding:8px 0; font-size:13px; color:#021745; font-weight:700;">{{ mobile_number }}</td>
                </tr>
                <tr>
                  <td style="padding:8px 0; font-size:13px; color:#5b6b8c;">Email</td>
                  <td style="padding:8px 0; font-size:13px; color:#021745; font-weight:700;">{{ email|default:"-" }}</td>
                </tr>
                <tr>
                  <td style="padding:8px 0; font-size:13px; color:#5b6b8c; border-top:1px solid #e2e6ea; vertical-align:top;">Message</td>
                  <td style="padding:8px 0; font-size:13px; color:#021745; font-weight:700; border-top:1px solid #e2e6ea; white-space:pre-wrap;">{{ message }}</td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td style="padding:16px 32px; background:#f5f7fa; border-top:1px solid #e2e6ea;">
              <p style="font-size:12px; color:#6b7280; margin:0;">Submitted via the Travu website contact form.</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>

services:
  - type: web
    name: blueholidays-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn blueholidays.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "travu.in,www.travu.in"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://travu.in,https://www.travu.in"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: BOOKING_NOTIFICATION_EMAIL
        sync: false

  - type: web
    name: blueholidays-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://blueholidays-backend.onrender.com/api"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
